
  <ejs-gantt
    [dataSource]="ganttDataManager"
    [taskFields]="taskFields"
    [editSettings]="editSettings"
    [toolbar]="toolbar"
    [allowSelection]="true"
    height="400px">

    <e-columns>
      <e-column field="TaskID" headerText="Task ID" width="90"></e-column>
      <e-column field="TaskName" headerText="Task Name" width="270"></e-column>
      <e-column field="StartDate" headerText="Start Date" format="yMd" width="150"></e-column>
      <e-column field="EndDate" headerText="End Date" width="150"></e-column>
      <e-column field="Duration" headerText="Duration" width="90"></e-column>
      <e-column field="Progress" headerText="Progress" width="120"></e-column>
    </e-columns>

  </ejs-gantt>
